<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 160" width="100%" height="100%">
  <defs>
    <!-- This filter applies the subtle, wobbly "ink bleed" edge seen in the reference image -->
    <filter id="ink-bleed" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.5" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <!-- Slightly rounds out any remaining sharp corners after displacement -->
      <feGaussianBlur in="displaced" stdDeviation="0.8" result="blurred" />
      <feComponentTransfer in="blurred">
        <feFuncA type="linear" slope="15" intercept="-5" />
      </feComponentTransfer>
    </filter>

    <!-- Mask to punch out the small, wobbly inner hole of the "D" -->
    <mask id="d-hole">
      <rect width="100%" height="100%" fill="white" />
      <!-- The inner hole, kept small to match the thick marker style -->
      <path d="M 62,55 C 75,57 82,72 78,95 C 65,102 58,90 58,55 Z" fill="black" />
    </mask>
  </defs>

  <!-- Apply the ink bleed filter to the whole group -->
  <g filter="url(#ink-bleed)" fill="black" stroke="black" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <!-- "D" - Thick, organic blob shape using the mask for the center -->
    <path mask="url(#d-hole)" d="M 42,28
             C 32,65 38,105 45,130
             C 75,135 122,125 118,75
             C 112,30 75,20 42,28 Z" />

    <!-- "C" - Thick, chunky crescent shape -->
    <path d="M 215,35
             C 175,12 135,45 138,90
             C 142,135 185,145 220,125
             C 232,118 225,98 212,105
             C 185,118 165,105 168,85
             C 172,62 185,48 208,58
             C 220,62 230,42 215,35 Z" />
  </g>
</svg>
